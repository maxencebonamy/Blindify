openapi: '3.0.3'
info:
  version: '1.0.0'
  title: 'Deezer API'
servers:
  - url: https://api.deezer.com
tags:
  - name: Albums
  - name: Artists
  - name: Playlists
  - name: Search
  - name: Tracks
  - name: Users

paths:
  /user/me:
    get:
      operationId: getCurrentUser
      tags:
        - Users
      responses:
        '200':
          description: 'Response'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/User'

  /user/me/playlists:
    get:
      operationId: getCurrentUserPlaylists
      tags:
        - Playlists
      responses:
        '200':
          description: 'Response'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#components/schemas/Playlist'

  /playlists/{id}:
    get:
      operationId: getPlaylist
      tags:
        - Playlists
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Response'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/Playlist'

  /playlists/{id}/tracks:
    get:
      operationId: getPlaylistTracks
      tags:
        - Playlists
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Response'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#components/schemas/Track'

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
            message:
              type: string
            code:
              type: integer
          required:
            - type
            - message
            - code
      required:
        - error

    User:
      type: object
      properties:
        id:
          type: string
          description: The user's Deezer ID
        name:
          type: string
          description: The user's Deezer nickname
        lastname:
          type: string
          description: The user's last name
        firstname:
          type: string
          description: The user's first name
        email:
          type: string
          format: email
          description: The user's email address
        status:
          type: integer
          description: The user's status code
        birthday:
          type: string
          format: date
          description: The user's birthday (YYYY-MM-DD)
        inscription_date:
          type: string
          format: date
          description: The user's inscription date (YYYY-MM-DD)
        gender:
          type: string
          description: The user's gender (F or M)
          enum: [F, M]
        link:
          type: string
          format: uri
          description: URL of the user's Deezer profile
        picture:
          type: string
          format: uri
          description: URL of the user's profile picture (default size)
        picture_small:
          type: string
          format: uri
          description: URL of the user's profile picture in size 'small'
        picture_medium:
          type: string
          format: uri
          description: URL of the user's profile picture in size 'medium'
        picture_big:
          type: string
          format: uri
          description: URL of the user's profile picture in size 'big'
        picture_xl:
          type: string
          format: uri
          description: URL of the user's profile picture in size 'xl'
        country:
          type: string
          description: The user's country code (ISO 3166-1 alpha-2)
        lang:
          type: string
          description: The user's language code (ISO 639-1)
        is_kid:
          type: boolean
          description: Whether the user is a kid account
        explicit_content_level:
          type: string
          description: The user's explicit content level according to their country
          enum: [explicit_display, explicit_no_recommendation, explicit_hide]
        explicit_content_levels_available:
          type: array
          description: The user's available explicit content levels
          items:
            type: string
            enum: [explicit_display, explicit_no_recommendation, explicit_hide]
        tracklist:
          type: string
          format: uri
          description: API link to the user's flow (tracklist)

    Artist:
      type: object
      properties:
        id:
          type: string
          description: The artist's Deezer ID
        name:
          type: string
          description: The artist's name
        link:
          type: string
          format: uri
          description: The URL of the artist on Deezer
        share:
          type: string
          format: uri
          description: The share link of the artist on Deezer
        picture:
          type: string
          format: uri
          description: The URL of the artist's picture (default size)
        picture_small:
          type: string
          format: uri
          description: The URL of the artist's picture in size 'small'
        picture_medium:
          type: string
          format: uri
          description: The URL of the artist's picture in size 'medium'
        picture_big:
          type: string
          format: uri
          description: The URL of the artist's picture in size 'big'
        picture_xl:
          type: string
          format: uri
          description: The URL of the artist's picture in size 'xl'
        nb_album:
          type: integer
          description: The number of albums released by the artist
        nb_fan:
          type: integer
          description: The number of fans following the artist
        radio:
          type: boolean
          description: Whether the artist has a dedicated smart radio
        tracklist:
          type: string
          format: uri
          description: API link to the artist's top tracks

    Album:
      type: object
      properties:
        id:
          type: integer
          description: The Deezer album ID
        title:
          type: string
          description: The album title
        upc:
          type: string
          description: The album UPC code
        link:
          type: string
          format: uri
          description: The URL of the album on Deezer
        share:
          type: string
          format: uri
          description: The share link of the album on Deezer
        cover:
          type: string
          format: uri
          description: The URL of the album's cover (default size)
        cover_small:
          type: string
          format: uri
          description: The URL of the album's cover in size 'small'
        cover_medium:
          type: string
          format: uri
          description: The URL of the album's cover in size 'medium'
        cover_big:
          type: string
          format: uri
          description: The URL of the album's cover in size 'big'
        cover_xl:
          type: string
          format: uri
          description: The URL of the album's cover in size 'xl'
        md5_image:
          type: string
          description: The MD5 hash of the album's cover image
        genre_id:
          type: integer
          description: The ID of the album's primary genre (-1 if not found)
        genres:
          type: array
          description: List of genres associated with the album
          items:
            type: object
            properties:
              id:
                type: integer
                description: Genre ID
              name:
                type: string
                description: Genre name
        label:
          type: string
          description: The label that produced the album
        provider:
          type: string
          description: The provider name
        nb_tracks:
          type: integer
          description: The number of tracks in the album
        duration:
          type: integer
          description: The total duration of the album in seconds
        fans:
          type: integer
          description: The number of fans of the album
        release_date:
          type: string
          format: date
          description: The album's release date (YYYY-MM-DD)
        record_type:
          type: string
          description: The album type (e.g., ALBUM, EP, SINGLE)
        available:
          type: boolean
          description: Whether the album is available for streaming
        alternative:
          type: object
          description: Alternative album object if the current one is unavailable
          $ref: '#/components/schemas/Album'
        tracklist:
          type: string
          format: uri
          description: API link to the album's tracklist
        explicit_lyrics:
          type: boolean
          description: Whether the album contains explicit lyrics
        explicit_content_lyrics:
          type: integer
          description: Explicit content lyrics level (0–7)
          enum: [0, 1, 2, 3, 4, 5, 6, 7]
        explicit_content_cover:
          type: integer
          description: Explicit content cover level (0–7)
          enum: [0, 1, 2, 3, 4, 5, 6, 7]
        contributors:
          type: array
          description: List of contributors involved in the album
          items:
            type: object
            properties:
              id:
                type: integer
                description: Contributor's Deezer ID
              name:
                type: string
                description: Contributor's name
              role:
                type: string
                description: Contributor's role
              link:
                type: string
                format: uri
                description: Deezer link to the contributor
        fallback:
          type: object
          description: Fallback album object with ID and status
          properties:
            id:
              type: integer
              description: Fallback album ID
            status:
              type: string
              description: Fallback status
        artist:
          type: object
          description: Main artist of the album
          $ref: '#/components/schemas/Artist'

    Track:
      type: object
      properties:
        id:
          type: integer
          description: The track's Deezer ID
        readable:
          type: boolean
          description: Whether the track is playable for the current user
        title:
          type: string
          description: The track's full title
        title_short:
          type: string
          description: The track's short title
        title_version:
          type: string
          description: The track's version
        unseen:
          type: boolean
          description: Whether the track is unseen by the user
        isrc:
          type: string
          description: The track's ISRC code
        link:
          type: string
          format: uri
          description: The URL of the track on Deezer
        share:
          type: string
          format: uri
          description: The share link of the track on Deezer
        duration:
          type: integer
          description: The track's duration in seconds
        track_position:
          type: integer
          description: The position of the track in its album
        disk_number:
          type: integer
          description: The disk number within the album
        rank:
          type: integer
          description: The track's Deezer rank
        release_date:
          type: string
          format: date
          description: The track's release date (YYYY-MM-DD)
        explicit_lyrics:
          type: boolean
          description: Whether the track contains explicit lyrics
        explicit_content_lyrics:
          type: integer
          description: 'The explicit content lyrics level (0: Not Explicit; 1: Explicit; 2: Unknown; 3: Edited; 6: No Advice Available)'
          enum: [0, 1, 2, 3, 6]
        explicit_content_cover:
          type: integer
          description: 'The explicit cover content level (0: Not Explicit; 1: Explicit; 2: Unknown; 3: Edited; 6: No Advice Available)'
          enum: [0, 1, 2, 3, 6]
        preview:
          type: string
          format: uri
          description: URL of the track's 30-second preview
        bpm:
          type: number
          format: float
          description: Beats per minute (tempo)
        gain:
          type: number
          format: float
          description: Signal strength (gain)
        available_countries:
          type: array
          description: List of ISO country codes where the track is available
          items:
            type: string
        alternative:
          type: object
          description: Alternative readable track if the current track is unavailable
          $ref: '#/components/schemas/Track'
        contributors:
          type: array
          description: List of contributors for the track
          items:
            type: object
            properties:
              id:
                type: integer
                description: The contributor's Deezer ID
              name:
                type: string
                description: The contributor's name
              role:
                type: string
                description: The contributor's role
              link:
                type: string
                format: uri
                description: The contributor's Deezer page URL
        md5_image:
          type: string
          description: The MD5 hash of the track’s image
        track_token:
          type: string
          description: The track token used for Deezer’s media service
        artist:
          $ref: '#/components/schemas/Artist'
        album:
          $ref: '#/components/schemas/Album'

    Playlist:
      type: object
      properties:
        id:
          type: string
          description: The playlist's Deezer ID
        title:
          type: string
          description: The playlist's title
        description:
          type: string
          description: The playlist's description
        duration:
          type: integer
          description: The playlist's total duration in seconds
        public:
          type: boolean
          description: Whether the playlist is public or not
        is_loved_track:
          type: boolean
          description: Whether this is the user's "Loved Tracks" playlist
        collaborative:
          type: boolean
          description: Whether the playlist is collaborative
        nb_tracks:
          type: integer
          description: Number of tracks in the playlist
        unseen_track_count:
          type: integer
          description: Number of tracks not seen
        fans:
          type: integer
          description: Number of users who are fans of this playlist
        link:
          type: string
          format: uri
          description: The URL of the playlist on Deezer
        share:
          type: string
          format: uri
          description: The shareable URL of the playlist
        picture:
          type: string
          format: uri
          description: The URL of the playlist's cover (default size)
        picture_small:
          type: string
          format: uri
          description: The URL of the playlist's cover in size 'small'
        picture_medium:
          type: string
          format: uri
          description: The URL of the playlist's cover in size 'medium'
        picture_big:
          type: string
          format: uri
          description: The URL of the playlist's cover in size 'big'
        picture_xl:
          type: string
          format: uri
          description: The URL of the playlist's cover in size 'xl'
        checksum:
          type: string
          description: The checksum for the playlist's track list
        creator:
          type: object
          description: The user who created the playlist
          properties:
            id:
              type: integer
              description: The creator's Deezer ID
            name:
              type: string
              description: The creator's Deezer name
