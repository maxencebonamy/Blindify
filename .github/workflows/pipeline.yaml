name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  setup:
    runs-on: self-hosted
    outputs:
      node-version: 18
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  audit:
    runs-on: self-hosted
    needs: setup
    steps:
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  build-librairies:
    runs-on: self-hosted
    needs: setup
    steps:
      - name: Build library
        run: pnpm -r --filter "./libs/*" run build

  lint:
    runs-on: self-hosted
    needs: build-librairies
    steps:
      - name: Run Lint
        run: pnpm -r run lint

  test:
    runs-on: self-hosted
    needs: build-librairies
    steps:
      - name: Run Tests
        run: pnpm -r run test

  build-backend:
    runs-on: self-hosted
    needs: [audit, lint, test]
    steps:
      - name: Generate OpenAPI
        run: pnpm -r --filter "./apps/app-backend" run gen

      - name: Build app
        run: pnpm -r --filter "./apps/app-backend" run build

  build-frontend:
    runs-on: self-hosted
    needs: [audit, lint, test]
    steps:
      - name: Generate OpenAPI
        run: pnpm -r --filter "./apps/app-frontend" run gen

      - name: Build app
        run: pnpm -r --filter "./apps/app-frontend" run build

  login-docker:
    runs-on: self-hosted
    needs: [setup]
    steps:
      - name: Login Docker registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set Docker image tag
        id: docker_tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            if [ -n "$GITHUB_HEAD_REF" ]; then
                BRANCH_NAME=$GITHUB_HEAD_REF
            else
                BRANCH_NAME=${GITHUB_REF##*/}
            fi
            SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            SHORT_SHA=${GITHUB_SHA:0:7}
            echo "IMAGE_TAG=${SAFE_BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_ENV
          fi

  docker-backend:
    runs-on: self-hosted
    needs: [login-docker, build-backend]
    steps:
      - name: Build and push Docker images
        run: |
          docker build --pull -t ${{ secrets.DOCKER_REGISTRY }}/blindify-backend:${IMAGE_TAG} -f ./apps/app-${{ matrix.app }}/Dockerfile .
          docker push ${{ secrets.DOCKER_REGISTRY }}/blindify-backend:${IMAGE_TAG}

  docker-frontend:
    runs-on: self-hosted
    needs: [login-docker, build-frontend]
    steps:
      - name: Build and push Docker images
        run: |
          docker build --pull -t ${{ secrets.DOCKER_REGISTRY }}/blindify-frontend:${IMAGE_TAG} -f ./apps/app-${{ matrix.app }}/Dockerfile .
          docker push ${{ secrets.DOCKER_REGISTRY }}/blindify-frontend:${IMAGE_TAG}

  security-backend:
    runs-on: self-hosted
    needs: [docker-backend]
    steps:
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/blindify-backend:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL

  security-frontend:
    runs-on: self-hosted
    needs: [docker-frontend]
    steps:
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/blindify-frontend:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
