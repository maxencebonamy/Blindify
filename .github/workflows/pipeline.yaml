name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  setup:
    runs-on: self-hosted
    outputs:
      node-version: 18
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
  
  install-dependencies:
    runs-on: self-hosted
    needs: setup
    strategy:
      matrix:
        subproject:
          - apps/app-backend
          - apps/app-frontend
          - libs/lib-auto-loader
          - libs/lib-cache
          - libs/lib-clip
          - libs/lib-env
          - libs/lib-logger
    steps:
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.subproject }}

  build-librairies:
    runs-on: self-hosted
    needs: [setup, install-dependencies]
    strategy:
      matrix:
        subproject:
          - libs/lib-env
          - libs/lib-logger
          - libs/lib-auto-loader
          - libs/lib-cache
          - libs/lib-clip
    steps:
      - name: Build library
        run: pnpm build
        working-directory: ${{ matrix.subproject }}

  lint:
    needs: [setup, install-dependencies, build-librairies]
    runs-on: self-hosted
    strategy:
      matrix:
        subproject:
          - apps/app-backend
          - apps/app-frontend
          - libs/lib-auto-loader
          - libs/lib-cache
          - libs/lib-clip
          - libs/lib-env
          - libs/lib-logger
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Run Lint
        run: pnpm lint
        working-directory: ${{ matrix.subproject }}

  test:
    needs: [setup, install-dependencies, build-librairies]
    runs-on: self-hosted
    strategy:
      matrix:
        subproject:
          - libs/lib-cache
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Run Tests
        run: pnpm test
        working-directory: ${{ matrix.subproject }}

  build-apps:
    needs: [lint, test]
    runs-on: self-hosted
    strategy:
      matrix:
        subproject:
          - apps/app-backend
          - apps/app-frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build app
        run: pnpm build
        working-directory: ${{ matrix.subproject }}

