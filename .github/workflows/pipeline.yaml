name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: |
          pnpm -r --filter "./libs/*" run build
          pnpm -r --filter "./apps/*" run gen
          pnpm -r --filter "./apps/*" run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            apps/**/dist
            libs/**/dist

  lint:
    runs-on: self-hosted
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Lint code
        run: pnpm -r run lint

  test:
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Run tests
        run: pnpm -r run test

  login-docker:
    runs-on: self-hosted
    needs: [lint, test]
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Login Docker registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set Docker image tag
        id: set_tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "image_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            if [ -n "$GITHUB_HEAD_REF" ]; then
                BRANCH_NAME=$GITHUB_HEAD_REF
            else
                BRANCH_NAME=${GITHUB_REF##*/}
            fi
            SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            SHORT_SHA=${GITHUB_SHA:0:7}
            echo "image_tag=${SAFE_BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

  docker:
    runs-on: self-hosted
    needs: [login-docker, build]
    strategy:
      matrix:
        app:
          - backend
          - frontend
    steps:
      - uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts

      - name: Build and push Docker image
        run: |
          export DOCKER_BUILDKIT=1
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_REGISTRY }}/blindify-${{ matrix.app }}:${{ needs.login-docker.outputs.image_tag }} \
            -f ./apps/app-${{ matrix.app }}/Dockerfile \
            --push .

  security:
    runs-on: self-hosted
    needs: docker
    continue-on-error: true
    strategy:
      matrix:
        app:
          - backend
          - frontend
    steps:
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/blindify-${{ matrix.app }}:${{ needs.login-docker.outputs.image_tag }}
          format: table
          severity: HIGH,CRITICAL
          timeout: 10m
