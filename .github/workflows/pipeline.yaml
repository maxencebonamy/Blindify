name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: |
          pnpm -r run audit
          pnpm -r run lint
          pnpm -r run test
          pnpm -r --filter "./libs/*" run build
          pnpm -r --filter "./apps/*" run gen
          pnpm -r --filter "./apps/*" run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            apps/**/dist
            libs/**/dist

  docker:
    runs-on: self-hosted
    needs: build
    strategy:
      matrix:
        app:
          - backend
          - frontend
    steps:
      - uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
            name: dist-artifacts
            path: ./dist

      - name: Login Docker registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set Docker image tag
        id: set_tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
          if [ -n "$GITHUB_HEAD_REF" ]; then
            BRANCH_NAME="$GITHUB_HEAD_REF"
          else
            BRANCH_NAME="${GITHUB_REF##*/}"
          fi
          SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "IMAGE_TAG=${SAFE_BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        run: |
          export DOCKER_BUILDKIT=1
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_REGISTRY }}/blindify-${{ matrix.app }}:${IMAGE_TAG} \
            -f ./apps/app-${{ matrix.app }}/Dockerfile \
            --push .


  security:
    runs-on: self-hosted
    needs: docker
    continue-on-error: true
    strategy:
      matrix:
        app:
          - backend
          - frontend
    steps:
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/blindify-${{ matrix.app }}:${{ needs.login-docker.outputs.image_tag }}
          format: table
          severity: HIGH,CRITICAL
          timeout: 10m
