name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  setup:
    runs-on: self-hosted
    outputs:
      node-version: 18
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install pnpm
        run: curl -fsSL https://get.pnpm.io/install.sh | sh -

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  audit:
    runs-on: self-hosted
    needs: setup
    continue-on-error: true
    steps:
      - name: Audit dependencies
        run: pnpm audit

  build-librairies:
    runs-on: self-hosted
    needs: setup
    steps:
      - name: Build library
        run: pnpm -r --filter "./libs/*" run build

  lint:
    runs-on: self-hosted
    needs: build-librairies
    continue-on-error: true
    steps:
      - name: Run Lint
        run: pnpm -r run lint

  test:
    runs-on: self-hosted
    needs: build-librairies
    steps:
      - name: Run Tests
        run: pnpm -r run test

  build-backend:
    runs-on: self-hosted
    needs: [audit, lint, test]
    steps:
      - name: Generate OpenAPI
        run: pnpm -r --filter "./apps/app-backend" run gen

      - name: Build app
        run: pnpm -r --filter "./apps/app-backend" run build

  build-frontend:
    runs-on: self-hosted
    needs: [audit, lint, test]
    steps:
      - name: Generate OpenAPI
        run: pnpm -r --filter "./apps/app-frontend" run gen

      - name: Build app
        run: pnpm -r --filter "./apps/app-frontend" run build

  login-docker:
    runs-on: self-hosted
    needs: [setup]
    outputs:
      image_tag: ${{ steps.docker_tag.outputs.image_tag }}
    steps:
      - name: Login Docker registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set Docker image tag
        id: docker_tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "image_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            if [ -n "$GITHUB_HEAD_REF" ]; then
                BRANCH_NAME=$GITHUB_HEAD_REF
            else
                BRANCH_NAME=${GITHUB_REF##*/}
            fi
            SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            SHORT_SHA=${GITHUB_SHA:0:7}
            echo "image_tag=${SAFE_BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

  docker-backend:
    runs-on: self-hosted
    needs: [login-docker, build-backend]
    steps:
      - name: Build and push Docker images
        run: |
          export DOCKER_BUILDKIT=1
          docker buildx build --platform linux/amd64 --pull -t ${{ secrets.DOCKER_REGISTRY }}/blindify-backend:${{ needs.login-docker.outputs.image_tag }} -f ./apps/app-backend/Dockerfile --push .

  docker-frontend:
    runs-on: self-hosted
    needs: [login-docker, build-frontend]
    steps:
      - name: Build and push Docker images
        run: |
          export DOCKER_BUILDKIT=1
          docker buildx build --platform linux/amd64 --pull -t ${{ secrets.DOCKER_REGISTRY }}/blindify-frontend:${{ needs.login-docker.outputs.image_tag }} -f ./apps/app-frontend/Dockerfile --push .

  security-backend:
    runs-on: self-hosted
    needs: [login-docker, docker-backend]
    continue-on-error: true
    steps:
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/blindify-backend:${{ needs.login-docker.outputs.image_tag }}
          format: table
          severity: HIGH,CRITICAL
          timeout: 10m

  security-frontend:
    runs-on: self-hosted
    needs: [login-docker, docker-frontend]
    continue-on-error: true
    steps:
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/blindify-frontend:${{ needs.login-docker.outputs.image_tag }}
          format: table
          severity: HIGH,CRITICAL
          timeout: 10m
