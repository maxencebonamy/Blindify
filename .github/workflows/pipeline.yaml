name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  setup:
    runs-on: self-hosted
    outputs:
      node-version: 18
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  build-librairies:
    runs-on: self-hosted
    needs: setup
    steps:
      - name: Build library
        run: pnpm -r --filter "./libs/*" run build

  lint:
    runs-on: self-hosted
    needs: build-librairies
    steps:
      - name: Run Lint
        run: pnpm -r run lint

  test:
    runs-on: self-hosted
    needs: build-librairies
    strategy:
      matrix:
        subproject:
          - libs/lib-cache
    steps:
      - name: Run Tests
        run: pnpm run test
        working-directory: ${{ matrix.subproject }}

  generate-openapis:
    runs-on: self-hosted
    needs: [lint, test]
    steps:
      - name: Generate OpenAPI
        run: pnpm -r --filter "./apps/*" run gen

  build-apps:
    runs-on: self-hosted
    needs: generate-openapis
    steps:
      - name: Build app
        run: pnpm -r --filter "./apps/*" run build

  docker:
    runs-on: self-hosted
    needs: build-apps
    strategy:
      matrix:
        app:
          - backend
          - frontend
    steps:
      - name: Set Docker image tag
        id: docker_tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            BRANCH_NAME=${GITHUB_REF##*/}
            SHORT_SHA=${GITHUB_SHA:0:7}
            echo "IMAGE_TAG=${BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Login Docker registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker images
        run: |
          docker build --pull -t ${{ secrets.DOCKER_REGISTRY }}/blindify-${{ matrix.app }}:${IMAGE_TAG} ./app-${{ matrix.app }}.dockerfile
          docker push ${{ secrets.DOCKER_REGISTRY }}/blindify-${{ matrix.app }}:${IMAGE_TAG}

