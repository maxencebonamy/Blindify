name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: |
          pnpm -r run audit
          pnpm -r run lint
          pnpm -r run test
          pnpm -r --filter "./libs/*" run gen
          pnpm -r --filter "./libs/*" run build
          pnpm -r --filter "./apps/*" run gen
          pnpm -r --filter "./apps/*" run build

      - name: Login Docker registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set Docker image tag
        id: set_tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            if [ -n "$GITHUB_HEAD_REF" ]; then
              BRANCH_NAME="$GITHUB_HEAD_REF"
            else
              BRANCH_NAME="${GITHUB_REF##*/}"
            fi
            SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            echo "IMAGE_TAG=${SAFE_BRANCH_NAME}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image (backend)
        run: |
          export DOCKER_BUILDKIT=1
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_REGISTRY }}/blindify-backend:${IMAGE_TAG} \
            -f ./apps/app-backend/Dockerfile \
            --push .

      - name: Build and push Docker image (frontend)
        run: |
          export DOCKER_BUILDKIT=1
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_REGISTRY }}/blindify-frontend:${IMAGE_TAG} \
            -f ./apps/app-frontend/Dockerfile \
            --push .
